    <rect x="351" width="182" height="52" rx="26" fill="url(#badge)" stroke="#195c60"/>
    <circle cx="378" cy="26" r="6" fill="#34d399"/>
    <text x="396" y="33" class="ui" font-size="17" font-weight="700" fill="#d1fae5">Review exposure</text>
