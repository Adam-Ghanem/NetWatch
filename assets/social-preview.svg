<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">NetWatch social preview</title>
  <desc id="desc">NetWatch local-first network visibility for authorized teams.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.52" stop-color="#0b1630"/>
      <stop offset="1" stop-color="#100d25"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="42%" r="52%">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".38"/>
      <stop offset=".48" stop-color="#7c3aed" stop-opacity=".22"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".56" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132a4d" stop-opacity=".96"/>
      <stop offset="1" stop-color="#16113a" stop-opacity=".86"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".6"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".22"/></pattern>
    <style>
      .ui{font-family:Inter,Arial,sans-serif}.heading{font-family:Inter,Arial,sans-serif;font-weight:800}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <circle cx="1052" cy="216" r="156" fill="#2563eb" fill-opacity=".20" filter="url(#blur)"/>
  <circle cx="952" cy="416" r="128" fill="#8b5cf6" fill-opacity=".16" filter="url(#blur)"/>

  <g opacity=".84">
    <path d="M712 112C808 148 841 143 913 100C992 53 1089 67 1193 119" fill="none" stroke="#38bdf8" stroke-opacity=".42" stroke-width="1.5" stroke-dasharray="6 12"/>
    <path d="M707 506C788 460 858 487 931 539C1019 603 1122 562 1228 509" fill="none" stroke="#a78bfa" stroke-opacity=".44" stroke-width="1.5" stroke-dasharray="6 12"/>
