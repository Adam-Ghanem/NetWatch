  <text x="80" y="256" class="heading" font-size="35" fill="#e5efff">Local-first network visibility</text>
  <text x="80" y="300" class="ui" font-size="28" fill="#a8b8d4">for authorized teams who need clear,</text>
  <text x="80" y="338" class="ui" font-size="28" fill="#a8b8d4">defensible answers about their local network.</text>

