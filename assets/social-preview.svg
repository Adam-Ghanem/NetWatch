    <rect x="1" y="1" width="446" height="46" rx="23" fill="#0f2139"/>
    <circle cx="30" cy="24" r="6" fill="#ef4444"/><circle cx="52" cy="24" r="6" fill="#f59e0b"/><circle cx="74" cy="24" r="6" fill="#22c55e"/>
    <text x="104" y="30" class="mono" font-size="14" fill="#8ba2bf">NETWATCH / OVERVIEW</text>
