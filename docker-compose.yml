services:
  netwatch:
    build: .
    container_name: netwatch
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NETWATCH_API_KEY: "${NETWATCH_API_KEY:-}"
      NETWATCH_OPERATOR_KEY: "${NETWATCH_OPERATOR_KEY:-}"
      NETWATCH_VIEWER_KEY: "${NETWATCH_VIEWER_KEY:-}"
      NETWATCH_AUDIT_HMAC_KEY: "${NETWATCH_AUDIT_HMAC_KEY:-}"
      NETWATCH_OIDC_ENABLED: "${NETWATCH_OIDC_ENABLED:-false}"
      NETWATCH_OIDC_ISSUER: "${NETWATCH_OIDC_ISSUER:-}"
      NETWATCH_OIDC_AUDIENCE: "${NETWATCH_OIDC_AUDIENCE:-}"
      NETWATCH_OIDC_JWKS_URL: "${NETWATCH_OIDC_JWKS_URL:-}"
      NETWATCH_OIDC_GROUPS_CLAIM: "${NETWATCH_OIDC_GROUPS_CLAIM:-groups}"
      NETWATCH_OIDC_ADMIN_GROUPS: "${NETWATCH_OIDC_ADMIN_GROUPS:-}"
      NETWATCH_OIDC_OPERATOR_GROUPS: "${NETWATCH_OIDC_OPERATOR_GROUPS:-}"
      NETWATCH_OIDC_VIEWER_GROUPS: "${NETWATCH_OIDC_VIEWER_GROUPS:-}"
      NETWATCH_OIDC_ALGORITHMS: "${NETWATCH_OIDC_ALGORITHMS:-RS256}"
      NETWATCH_OIDC_CLOCK_SKEW_SECONDS: "${NETWATCH_OIDC_CLOCK_SKEW_SECONDS:-30}"
      NETWATCH_OIDC_MAX_TOKEN_AGE_SECONDS: "${NETWATCH_OIDC_MAX_TOKEN_AGE_SECONDS:-3600}"
      NETWATCH_OIDC_JWKS_CACHE_SECONDS: "${NETWATCH_OIDC_JWKS_CACHE_SECONDS:-300}"
      NETWATCH_OIDC_JWKS_TIMEOUT_SECONDS: "${NETWATCH_OIDC_JWKS_TIMEOUT_SECONDS:-5}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      NETWATCH_AI_SAFETY_SECRET: "${NETWATCH_AI_SAFETY_SECRET:-}"
      NETWATCH_AI_SUBJECT_ID: "${NETWATCH_AI_SUBJECT_ID:-}"
      NETWATCH_AI_ENABLED: "${NETWATCH_AI_ENABLED:-true}"
      NETWATCH_AI_MODEL: "${NETWATCH_AI_MODEL:-gpt-5.6-luna}"
      NETWATCH_AI_TIMEOUT_SECONDS: "${NETWATCH_AI_TIMEOUT_SECONDS:-25}"
      NETWATCH_AI_MAX_OUTPUT_TOKENS: "${NETWATCH_AI_MAX_OUTPUT_TOKENS:-1200}"
      NETWATCH_AI_MAX_CONCURRENT_REQUESTS: "${NETWATCH_AI_MAX_CONCURRENT_REQUESTS:-2}"
      NETWATCH_AI_RATE_LIMIT_REQUESTS: "${NETWATCH_AI_RATE_LIMIT_REQUESTS:-5}"
      NETWATCH_AI_RATE_LIMIT_WINDOW_SECONDS: "${NETWATCH_AI_RATE_LIMIT_WINDOW_SECONDS:-600}"
      NETWATCH_AI_DAILY_REQUEST_LIMIT: "${NETWATCH_AI_DAILY_REQUEST_LIMIT:-50}"
      NETWATCH_AI_CACHE_TTL_SECONDS: "${NETWATCH_AI_CACHE_TTL_SECONDS:-900}"
      NETWATCH_ALLOWED_HOSTS: "${NETWATCH_ALLOWED_HOSTS:-127.0.0.1,localhost}"
      NETWATCH_ALLOWED_ORIGINS: "${NETWATCH_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}"
      NETWATCH_API_DOCS: "${NETWATCH_API_DOCS:-false}"
      NETWATCH_MAX_CONCURRENT_SCANS: "${NETWATCH_MAX_CONCURRENT_SCANS:-1}"
      NETWATCH_MAX_CONCURRENT_CAPTURES: "${NETWATCH_MAX_CONCURRENT_CAPTURES:-1}"
      NETWATCH_RATE_LIMIT_REQUESTS: "${NETWATCH_RATE_LIMIT_REQUESTS:-30}"
      NETWATCH_RATE_LIMIT_WINDOW_SECONDS: "${NETWATCH_RATE_LIMIT_WINDOW_SECONDS:-60}"
      NETWATCH_PORT_SCAN_WORKERS: "${NETWATCH_PORT_SCAN_WORKERS:-12}"
      NETWATCH_WEBHOOK_URL: "${NETWATCH_WEBHOOK_URL:-}"
      NETWATCH_SLACK_WEBHOOK_URL: "${NETWATCH_SLACK_WEBHOOK_URL:-}"
      NETWATCH_NOTIFY_MIN_SEVERITY: "${NETWATCH_NOTIFY_MIN_SEVERITY:-High}"
      NETWATCH_NOTIFY_DEBOUNCE_SECONDS: "${NETWATCH_NOTIFY_DEBOUNCE_SECONDS:-900}"
      NETWATCH_NOTIFY_INCLUDE_RAW_TARGETS: "${NETWATCH_NOTIFY_INCLUDE_RAW_TARGETS:-false}"
      NETWATCH_SCHEDULER_ENABLED: "${NETWATCH_SCHEDULER_ENABLED:-false}"
      NETWATCH_SCHEDULER_POLL_SECONDS: "${NETWATCH_SCHEDULER_POLL_SECONDS:-30}"
    volumes:
      - netwatch-data:/app/data
      - netwatch-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=268435456
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    restart: unless-stopped

  streamlit:
    profiles: ["legacy"]
    build: .
    container_name: netwatch-streamlit
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - netwatch-data:/app/data
      - netwatch-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=268435456
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    restart: unless-stopped

volumes:
  netwatch-data:
  netwatch-logs:
