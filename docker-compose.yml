services:
  netwatch:
    build: .
    container_name: netwatch
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NETWATCH_API_KEY: "${NETWATCH_API_KEY:-}"
      NETWATCH_OPERATOR_KEY: "${NETWATCH_OPERATOR_KEY:-}"
      NETWATCH_VIEWER_KEY: "${NETWATCH_VIEWER_KEY:-}"
      NETWATCH_ALLOWED_HOSTS: "${NETWATCH_ALLOWED_HOSTS:-127.0.0.1,localhost}"
      NETWATCH_ALLOWED_ORIGINS: "${NETWATCH_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}"
      NETWATCH_API_DOCS: "${NETWATCH_API_DOCS:-false}"
      NETWATCH_MAX_CONCURRENT_SCANS: "${NETWATCH_MAX_CONCURRENT_SCANS:-1}"
      NETWATCH_RATE_LIMIT_REQUESTS: "${NETWATCH_RATE_LIMIT_REQUESTS:-30}"
      NETWATCH_RATE_LIMIT_WINDOW_SECONDS: "${NETWATCH_RATE_LIMIT_WINDOW_SECONDS:-60}"
      NETWATCH_PORT_SCAN_WORKERS: "${NETWATCH_PORT_SCAN_WORKERS:-12}"
    volumes:
      - netwatch-data:/app/data
      - netwatch-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    restart: unless-stopped

  streamlit:
    profiles: ["legacy"]
    build: .
    container_name: netwatch-streamlit
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - netwatch-data:/app/data
      - netwatch-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    restart: unless-stopped

volumes:
  netwatch-data:
  netwatch-logs:
