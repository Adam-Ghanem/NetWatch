<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">NetWatch liquid glass risk advisor</title>
  <desc id="desc">Dark NetWatch evidence-backed risk advisor with deterministic priorities, next steps, confidence, and de-identified intelligence status using sample private-network data.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b304b" stop-opacity=".88"/><stop offset=".45" stop-color="#112239" stop-opacity=".82"/><stop offset="1" stop-color="#0a1729" stop-opacity=".9"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263b58" stop-opacity=".72"/><stop offset="1" stop-color="#132138" stop-opacity=".78"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd5cff"/><stop offset=".55" stop-color="#7c4bea"/><stop offset="1" stop-color="#3477e2"/></linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b44fff"/><stop offset="1" stop-color="#7741e7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>

  <rect width="1200" height="720" fill="#080d16"/>
  <circle cx="865" cy="-40" r="360" fill="#6355d8" opacity=".1"/><circle cx="1060" cy="680" r="300" fill="#a855f7" opacity=".055"/>

