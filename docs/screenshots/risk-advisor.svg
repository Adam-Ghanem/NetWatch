  <rect width="210" height="720" fill="#0c1422"/><line x1="209" y1="0" x2="209" y2="720" stroke="#253248"/>
  <g transform="translate(18 18)"><rect width="38" height="38" rx="10" fill="#fff"/><path d="M19 7 30 11v8c0 7-4.6 12-11 15-6.4-3-11-8-11-15v-8z" fill="#2c0f50"/><path d="M11 20c4.4-5 11.6-5 16 0-4.4 5-11.6 5-16 0z" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="19" cy="20" r="2.6" fill="#fff"/><text x="50" y="17" fill="#f5f7fb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750">NetWatch</text><text x="50" y="32" fill="#7e8ba1" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="700" letter-spacing="1">ENTERPRISE SECURITY</text></g>
  <line x1="18" y1="76" x2="192" y2="76" stroke="#253248"/><text x="24" y="101" fill="#647187" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="800" letter-spacing="1.4">WORKSPACE</text>
  <g font-family="Inter,Arial,sans-serif" font-size="11" font-weight="650">
    <g fill="#8491a7"><text x="58" y="138">Overview</text><text x="58" y="178">Network scan</text><text x="58" y="218">Host check</text><text x="58" y="258">Port audit</text><text x="58" y="298">Inventory</text><text x="58" y="378">Audit log</text><text x="58" y="418">Operations</text><text x="58" y="458">Reports</text></g>
    <g fill="none" stroke="#7d8ba2" stroke-width="1.5"><rect x="25" y="125" width="16" height="16" rx="4"/><circle cx="33" cy="174" r="8"/><rect x="25" y="205" width="17" height="12" rx="2"/><path d="M25 250h16l-4-4m4 4-4 4m4 7H25l4-4m-4 4 4 4"/><ellipse cx="33" cy="292" rx="8" ry="3"/><path d="M25 292v10c0 2 3.5 3 8 3s8-1 8-3v-10"/><path d="M25 367h17M25 373h13"/><circle cx="33" cy="414" r="8"/><path d="M33 448v12m-5-5 5 5 5-5"/></g>
    <rect x="12" y="312" width="186" height="42" rx="10" fill="url(#nav)" stroke="#d6b6ff" stroke-opacity=".26"/><path d="m33 322 2.2 6 6 2.2-6 2.2-2.2 6-2.2-6-6-2.2 6-2.2z" fill="none" stroke="#fff" stroke-width="1.5"/><text x="58" y="338" fill="#fff">Risk advisor</text>
  </g>
  <g transform="translate(12 646)"><rect width="186" height="60" rx="11" fill="url(#card)" stroke="#2e3e56"/><circle cx="17" cy="18" r="4" fill="#22c77a"/><text x="28" y="19" fill="#f5f7fb" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">API online</text><text x="28" y="33" fill="#7e8ba1" font-family="Inter,Arial,sans-serif" font-size="7">NetWatch v1.6.0</text><rect x="10" y="39" width="166" height="15" rx="5" fill="#fff" fill-opacity=".035" stroke="#344159"/><text x="76" y="50" fill="#aeb8c8" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="700">Disconnect</text></g>

  <!-- Topbar -->
  <rect x="210" width="990" height="68" fill="#0a111e" fill-opacity=".88"/><line x1="210" y1="67" x2="1200" y2="67" stroke="#253248"/>
  <text x="240" y="22" fill="#ae5cff" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="800" letter-spacing="1.2">AUTHORIZED LOCAL NETWORKS ONLY</text><text x="240" y="49" fill="#f5f7fb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="750">Risk advisor</text>
  <rect x="575" y="15" width="295" height="38" rx="12" fill="url(#card)" stroke="#a8bee1" stroke-opacity=".18"/><circle cx="596" cy="34" r="6" fill="none" stroke="#aab6c9" stroke-width="1.4"/><path d="m600 38 5 5" stroke="#aab6c9" stroke-width="1.4"/><text x="615" y="38" fill="#8592a7" font-family="Inter,Arial,sans-serif" font-size="9">Search modules and actions</text><rect x="828" y="23" width="34" height="21" rx="6" fill="#fff" fill-opacity=".04" stroke="#baccE8" stroke-opacity=".16"/><text x="835" y="37" fill="#aebbd0" font-family="Inter,Arial,sans-serif" font-size="7">Ctrl K</text>
  <rect x="894" y="20" width="88" height="28" rx="14" fill="#0f3125" stroke="#2b6b53"/><circle cx="907" cy="34" r="3" fill="#22c77a"/><text x="916" y="37" fill="#83dfb3" font-family="Inter,Arial,sans-serif" font-size="7">Updated now</text><rect x="992" y="20" width="62" height="28" rx="14" fill="#102a22" stroke="#225d45"/><text x="1007" y="37" fill="#71e8ad" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800">ADMIN</text><rect x="1064" y="16" width="68" height="36" rx="9" fill="url(#card)" stroke="#344159"/><text x="1082" y="38" fill="#d8b4fe" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">Refresh</text><text x="1144" y="38" fill="#8592a7" font-family="Inter,Arial,sans-serif" font-size="8">14:35</text>

  <!-- Heading -->
  <text x="240" y="100" fill="#ae5cff" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="1.2">DETERMINISTIC LOCAL ANALYSIS</text><text x="240" y="127" fill="#f5f7fb" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750">Evidence-backed risk guidance</text><text x="240" y="147" fill="#8592a7" font-family="Inter,Arial,sans-serif" font-size="9">Priorities derived from saved host, service, ownership, and change evidence.</text>

  <!-- Main advisor panel -->
  <g filter="url(#shadow)"><rect x="240" y="169" width="660" height="507" rx="18" fill="url(#panel)" stroke="#3a506e" stroke-opacity=".78"/></g><path d="M261 170h360" stroke="#fff" stroke-opacity=".11"/>
  <text x="266" y="200" fill="#ae5cff" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="1.1">CURRENT GUIDANCE</text><text x="266" y="228" fill="#f5f7fb" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750">Review three priority assets</text><rect x="790" y="193" width="84" height="28" rx="14" fill="#342710" stroke="#775a21"/><text x="811" y="211" fill="#ffd173" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800">MEDIUM</text>
  <rect x="266" y="252" width="608" height="97" rx="14" fill="#07111f" fill-opacity=".5" stroke="#34465f"/><circle cx="294" cy="280" r="13" fill="#a855f7" fill-opacity=".17" stroke="#b968ff"/><path d="m294 272 2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="none" stroke="#d8b4fe" stroke-width="1.2"/><text x="318" y="280" fill="#f5f7fb" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="750">3 assets require review across 24 saved hosts.</text><text x="286" y="309" fill="#aeb9c9" font-family="Inter,Arial,sans-serif" font-size="8.8">Remote administration and one unencrypted web service are the highest priorities.</text><text x="286" y="328" fill="#8592a7" font-family="Inter,Arial,sans-serif" font-size="8.5">Validate ownership and intended exposure before applying approved remediation.</text>
  <line x1="266" y1="379" x2="874" y2="379" stroke="#2d3e56"/>
  <text x="266" y="409" fill="#f5f7fb" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="750">Priority findings</text><text x="576" y="409" fill="#f5f7fb" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="750">Suggested next steps</text>
  <g font-family="Inter,Arial,sans-serif" font-size="9"><circle cx="280" cy="443" r="12" fill="#f0526e"/><text x="277" y="447" fill="#fff" font-weight="800">1</text><text x="302" y="447" fill="#c6d0dd">SSH open on 192.168.10.6</text><circle cx="280" cy="486" r="12" fill="#f3a92f"/><text x="277" y="490" fill="#fff" font-weight="800">2</text><text x="302" y="490" fill="#c6d0dd">HTTP service lacks encryption</text><circle cx="280" cy="529" r="12" fill="#2d8cff"/><text x="277" y="533" fill="#fff" font-weight="800">3</text><text x="302" y="533" fill="#c6d0dd">Unknown owner for one asset</text>
  <circle cx="590" cy="443" r="12" fill="#a855f7"/><path d="m585 443 3 3 7-7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="612" y="447" fill="#c6d0dd">Confirm business owner and role</text><circle cx="590" cy="486" r="12" fill="#7c4bea"/><path d="m585 486 3 3 7-7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="612" y="490" fill="#c6d0dd">Restrict remote access where possible</text><circle cx="590" cy="529" r="12" fill="#3477e2"/><path d="m585 529 3 3 7-7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="612" y="533" fill="#c6d0dd">Re-scan after approved changes</text></g>
  <rect x="266" y="568" width="608" height="73" rx="13" fill="#0b211c" fill-opacity=".72" stroke="#245744"/><circle cx="287" cy="594" r="5" fill="#22c77a"/><text x="302" y="598" fill="#7fe3af" font-family="Inter,Arial,sans-serif" font-size="8.5" font-weight="750">Local evidence boundary</text><text x="286" y="620" fill="#8eaa9e" font-family="Inter,Arial,sans-serif" font-size="8">Raw scan data stays in NetWatch; optional intelligence receives only de-identified aggregates.</text>

  <!-- Confidence panel -->
  <g filter="url(#shadow)"><rect x="920" y="169" width="250" height="255" rx="18" fill="url(#panel)" stroke="#3a506e" stroke-opacity=".78"/></g><text x="944" y="198" fill="#ae5cff" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="1.1">CONFIDENCE</text><text x="944" y="224" fill="#f5f7fb" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Evidence coverage</text>
  <g transform="translate(1045 304) rotate(-90)"><circle r="58" fill="none" stroke="#26354b" stroke-width="12"/><circle r="58" fill="none" stroke="#a855f7" stroke-width="12" stroke-linecap="round" stroke-dasharray="313 365"/></g><text x="1045" y="295" fill="#8592a7" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="700" letter-spacing="1">CONFIDENCE</text><text x="1045" y="331" fill="#f5f7fb" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="750">86%</text><rect x="976" y="382" width="138" height="27" rx="14" fill="#211632" stroke="#553273"/><text x="997" y="399" fill="#d8b4fe" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="750">High evidence quality</text>

  <!-- Evidence and intelligence -->
  <g filter="url(#shadow)"><rect x="920" y="442" width="250" height="234" rx="18" fill="url(#panel)" stroke="#3a506e" stroke-opacity=".78"/></g><text x="944" y="471" fill="#ae5cff" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="1.1">EVIDENCE SNAPSHOT</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="944" y="490" width="92" height="62" rx="12" fill="url(#card)" stroke="#34465f"/><text x="958" y="511" fill="#8290a5" font-size="7">SAVED ASSETS</text><text x="958" y="539" fill="#f5f7fb" font-size="21" font-weight="750">24</text><rect x="1046" y="490" width="100" height="62" rx="12" fill="url(#card)" stroke="#34465f"/><text x="1060" y="511" fill="#8290a5" font-size="7">SERVICES</text><text x="1060" y="539" fill="#f5f7fb" font-size="21" font-weight="750">8</text><rect x="944" y="562" width="202" height="43" rx="12" fill="url(#card)" stroke="#34465f"/><text x="958" y="588" fill="#c6d0dd" font-size="8.5">12 recent checks · 4 evidence sources</text></g>
  <rect x="944" y="617" width="202" height="39" rx="12" fill="#0f3125" fill-opacity=".7" stroke="#2b6b53"/><circle cx="961" cy="636" r="4" fill="#22c77a"/><text x="973" y="635" fill="#83dfb3" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="750">Secure intelligence ready</text><text x="973" y="647" fill="#6fa88b" font-family="Inter,Arial,sans-serif" font-size="6.5">Human review required</text>
  <text x="1012" y="701" fill="#647187" font-family="Inter,Arial,sans-serif" font-size="7">Sample data · product preview</text>
