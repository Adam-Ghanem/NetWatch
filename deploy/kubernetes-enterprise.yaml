apiVersion: v1
kind: Namespace
metadata:
  name: netwatch
  labels:
    app.kubernetes.io/name: netwatch
    app.kubernetes.io/part-of: defensive-observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netwatch
  namespace: netwatch
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netwatch-enterprise-config
  namespace: netwatch
data:
  NETWATCH_ENTERPRISE_MODE: "shared_service"
  NETWATCH_DATABASE_BACKEND: "postgresql"
  NETWATCH_COORDINATION_BACKEND: "redis"
  NETWATCH_OBJECT_STORAGE_BACKEND: "s3"
  NETWATCH_EVENT_SINK: "https"
  NETWATCH_OIDC_ENABLED: "true"
  NETWATCH_API_DOCS: "false"
  NETWATCH_ALLOWED_HOSTS: "netwatch.example.internal"
  NETWATCH_ALLOWED_ORIGINS: "https://netwatch.example.internal"
  NETWATCH_MAX_CONCURRENT_SCANS: "8"
  NETWATCH_MAX_CONCURRENT_CAPTURES: "2"
  NETWATCH_SCHEDULER_ENABLED: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: netwatch
  namespace: netwatch
  labels:
    app.kubernetes.io/name: netwatch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netwatch
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netwatch
  namespace: netwatch
  labels:
    app.kubernetes.io/name: netwatch
    app.kubernetes.io/part-of: defensive-observability
  annotations:
    netwatch.example.com/architecture: "abc-shared-service"
    netwatch.example.com/requirements: "validated-postgresql-redis-s3-event-sink"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netwatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netwatch
        app.kubernetes.io/part-of: defensive-observability
    spec:
      serviceAccountName: netwatch
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netwatch
          image: ghcr.io/your-org/netwatch:replace-with-signed-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: netwatch-enterprise-config
            - secretRef:
                name: netwatch-runtime-secrets
          env:
            - name: NETWATCH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netwatch-runtime-secrets
                  key: database-url
            - name: NETWATCH_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: netwatch-runtime-secrets
                  key: redis-url
            - name: NETWATCH_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: netwatch-runtime-secrets
                  key: s3-bucket
            - name: NETWATCH_EVENT_SINK_URL
              valueFrom:
                secretKeyRef:
                  name: netwatch-runtime-secrets
                  key: event-sink-url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: netwatch
  namespace: netwatch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netwatch
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netwatch-default-deny
  namespace: netwatch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: netwatch
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netwatch-allow-required-egress
  namespace: netwatch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: netwatch
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netwatch-allow-gateway-ingress
  namespace: netwatch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: netwatch
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity-gateway
      ports:
        - protocol: TCP
          port: 8000
