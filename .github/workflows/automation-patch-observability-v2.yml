name: One-shot observability implementation v2

on:
  push:
    branches:
      - feat/observability-export-api

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/observability-export-api
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Apply bounded observability export implementation
        shell: python
        run: |
          from pathlib import Path

          source = Path('.github/workflows/automation-patch-observability.yml').read_text().splitlines()
          shell_index = source.index('        shell: python')
          run_index = source.index('        run: |', shell_index)
          end_index = next(
              index
              for index in range(run_index + 1, len(source))
              if source[index].startswith('      - name: Format and verify focused behavior')
          )
          script_lines = source[run_index + 1 : end_index]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line for line in script_lines
          )
          exec(compile(script, '<observability-patch>', 'exec'))

      - name: Format and verify focused behavior
        run: |
          black backend/main.py flow_observability.py tests/test_api_observability_exports.py
          isort backend/main.py flow_observability.py tests/test_api_observability_exports.py
          flake8 backend/main.py flow_observability.py tests/test_api_observability_exports.py
          mypy backend/main.py flow_observability.py
          pytest -q tests/test_flow_observability.py tests/test_api_observability_exports.py

      - name: Commit implementation and remove one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py flow_observability.py tests/test_api_observability_exports.py
          git rm .github/workflows/automation-patch-observability.yml
          git rm .github/workflows/automation-patch-observability-v2.yml
          git commit -m "feat: add authenticated observability export APIs"
          git push origin HEAD:feat/observability-export-api
