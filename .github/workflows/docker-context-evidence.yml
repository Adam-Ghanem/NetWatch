name: Docker context evidence

on:
  push:
    branches:
      - "ci/docker-context-evidence-*"
  pull_request:
    branches:
      - main
      - "test/docker-context-synthetic-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Confirm Docker daemon and BuildKit
        run: |
          docker version
          docker info
          docker buildx version

      - name: Install minimal test dependency
        run: python -m pip install "pytest>=8,<10"

      - name: Exercise real Docker ignore matcher offline
        env:
          DOCKER_BUILDKIT: "1"
        run: python -m pytest -q -rs tests/test_docker_context_integration.py
