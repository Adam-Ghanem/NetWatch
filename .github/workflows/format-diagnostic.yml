name: Format diagnostic

on:
  push:
    branches: [feature/flow-investigation-timeline]

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install formatter
        run: python -m pip install black==26.3.1

      - name: Capture Black diff
        run: black --diff flow_timeline.py tests/test_flow_timeline.py > black.diff || true

      - name: Upload Black diff
        uses: actions/upload-artifact@v4
        with:
          name: black-format-diff
          path: black.diff
          if-no-files-found: error
