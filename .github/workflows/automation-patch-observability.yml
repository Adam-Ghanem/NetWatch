name: One-shot observability implementation

on:
  push:
    branches:
      - feat/observability-export-api

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/observability-export-api
          fetch-depth: 0

      - name: Apply bounded observability export implementation
        shell: python
        run: |
          from pathlib import Path

          flow_path = Path("flow_observability.py")
          flow = flow_path.read_text()
          import_anchor = "from __future__ import annotations\n\nfrom ipaddress import ip_address\n"
          assert flow.count(import_anchor) == 1
          flow = flow.replace(
              import_anchor,
              "from __future__ import annotations\n\nimport json\nfrom ipaddress import ip_address\n",
          )
          function_anchor = "\ndef build_flow_observability_records(\n"
          assert flow.count(function_anchor) == 1
          serializers = '''\ndef export_flow_observability_json(\n    flows: list[dict[str, object]], *, limit: int = 100\n) -> bytes:\n    \"\"\"Serialize bounded privacy-first flow records as a JSON integration document.\"\"\"\n\n    records = build_flow_observability_records(flows, limit=limit)\n    document = {\n        \"schema\": \"netwatch.flow.v1\",\n        \"count\": len(records),\n        \"payload_retained\": False,\n        \"records\": records,\n    }\n    return (json.dumps(document, separators=(\",\", \":\"), sort_keys=True) + \"\\n\").encode(\n        \"utf-8\"\n    )\n\n\ndef export_flow_observability_ndjson(\n    flows: list[dict[str, object]], *, limit: int = 100\n) -> bytes:\n    \"\"\"Serialize bounded privacy-first flow records as newline-delimited JSON.\"\"\"\n\n    records = build_flow_observability_records(flows, limit=limit)\n    text = \"\\n\".join(\n        json.dumps(record, separators=(\",\", \":\"), sort_keys=True) for record in records\n    )\n    if text:\n        text += \"\\n\"\n    return text.encode(\"utf-8\")\n\n'''
          flow = flow.replace(function_anchor, serializers + function_anchor)
          flow_path.write_text(flow)

          main_path = Path("backend/main.py")
          main = main_path.read_text()
          import_anchor = (
              "from flow_export import export_flows_csv, export_flows_json, export_flows_ndjson\n"
          )
          assert main.count(import_anchor) == 1
          main = main.replace(
              import_anchor,
              import_anchor
              + "from flow_observability import (\n"
              + "    export_flow_observability_json,\n"
              + "    export_flow_observability_ndjson,\n"
              + ")\n",
          )

          offline_anchor = '\n\n@app.get("/api/traffic/interfaces")\n'
          assert main.count(offline_anchor) == 1
          offline_route = '''\n\n@app.post("/api/traffic/offline/observability.{export_format}")\nasync def export_offline_capture_observability(\n    export_format: Literal["json", "ndjson"],\n    request: Request,\n    authorized: bool = Query(default=False),\n    packet_limit: int = Query(default=1_000, ge=1, le=MAX_PCAP_PACKETS),\n    display_filter: str = Query(default="", max_length=1_024),\n    ip_address: str = Query(default="", max_length=45),\n    protocol: str = Query(default="", max_length=16),\n    service: str = Query(default="", max_length=64),\n    state: str = Query(default="", max_length=64),\n    min_bytes: int = Query(default=0, ge=0),\n    sort_by: Literal["bytes", "packets", "duration", "recent"] = Query(default="bytes"),\n    flow_limit: int = Query(default=100, ge=1, le=1_000),\n    context: AuthContext = Depends(require_audited_operator_access),\n) -> Response:\n    _require_authorization(authorized)\n    data = await _read_bounded_capture_upload(request)\n    controls = TrafficFlowControls(\n        display_filter=display_filter,\n        ip_address=ip_address,\n        protocol=protocol,\n        service=service,\n        state=state,\n        min_bytes=min_bytes,\n        sort_by=sort_by,\n        limit=flow_limit,\n    )\n    try:\n        with _capture_slot():\n            result = analyze_capture_bytes(\n                data,\n                packet_limit=packet_limit,\n                controls=controls,\n            )\n    except ValueError as exc:\n        raise HTTPException(status_code=400, detail=str(exc)) from exc\n\n    flows = result.get("flows", [])\n    if export_format == "json":\n        content = export_flow_observability_json(flows, limit=flow_limit)\n        media_type = "application/json"\n    else:\n        content = export_flow_observability_ndjson(flows, limit=flow_limit)\n        media_type = "application/x-ndjson"\n\n    source = str(result.get("source", "capture"))\n    exported_count = min(len(flows), flow_limit)\n    record_audit_event(\n        context.role,\n        "offline_capture_observability_export",\n        source,\n        "completed",\n        (\n            f"Analyzed {result.get('captured_packets', 0)} packet header(s); "\n            f"export_format={export_format}; exported_records={exported_count}; "\n            "payload_retained=false."\n        ),\n        **context.audit_fields,\n    )\n    return Response(\n        content=content,\n        media_type=media_type,\n        headers={\n            "Content-Disposition": (\n                f'attachment; filename="netwatch-offline-observability.{export_format}"'\n            )\n        },\n    )\n'''
          main = main.replace(offline_anchor, offline_route + offline_anchor)

          live_anchor = '\n\n@app.get("/api/inventory", dependencies=[Depends(require_api_access)])\n'
          assert main.count(live_anchor) == 1
          live_route = '''\n\n@app.post("/api/traffic/capture/observability.{export_format}")\ndef export_capture_observability(\n    export_format: Literal["json", "ndjson"],\n    payload: TrafficCaptureRequest,\n    context: AuthContext = Depends(require_audited_operator_access),\n) -> Response:\n    _require_authorization(payload.authorized)\n    try:\n        capture_filter = build_capture_filter(\n            protocol=payload.protocol,\n            ip_address=payload.ip_filter,\n            port=payload.port_filter,\n        )\n        with _capture_slot():\n            result = capture_traffic(\n                interface=payload.interface,\n                duration_seconds=payload.duration_seconds,\n                max_packets=payload.max_packets,\n                capture_filter=capture_filter,\n            )\n        if payload.flow_controls is not None:\n            result = apply_traffic_flow_controls(\n                result,\n                payload.flow_controls.to_controls(),\n            )\n    except ValueError as exc:\n        raise HTTPException(status_code=400, detail=str(exc)) from exc\n    except CapturePermissionError as exc:\n        raise HTTPException(\n            status_code=503,\n            detail=(\n                "Live capture needs NET_RAW/root packet access on the NetWatch sensor. "\n                "No packet data was retained."\n            ),\n        ) from exc\n    except CaptureUnavailableError as exc:\n        raise HTTPException(\n            status_code=503,\n            detail="Live packet metadata capture is unavailable on the selected interface.",\n        ) from exc\n\n    limit = payload.flow_controls.limit if payload.flow_controls is not None else 100\n    flows = result.get("flows", [])\n    if export_format == "json":\n        content = export_flow_observability_json(flows, limit=limit)\n        media_type = "application/json"\n    else:\n        content = export_flow_observability_ndjson(flows, limit=limit)\n        media_type = "application/x-ndjson"\n\n    exported_count = min(len(flows), limit)\n    record_audit_event(\n        context.role,\n        "traffic_observability_export",\n        str(result["interface"]),\n        "completed",\n        (\n            f"Captured {result['captured_packets']} packet header(s); "\n            f"export_format={export_format}; exported_records={exported_count}; "\n            "payload_retained=false."\n        ),\n        **context.audit_fields,\n    )\n    return Response(\n        content=content,\n        media_type=media_type,\n        headers={\n            "Content-Disposition": f'attachment; filename="netwatch-observability.{export_format}"'\n        },\n    )\n'''
          main = main.replace(live_anchor, live_route + live_anchor)
          main_path.write_text(main)

      - name: Format and verify focused behavior
        run: |
          black backend/main.py flow_observability.py tests/test_api_observability_exports.py
          isort backend/main.py flow_observability.py tests/test_api_observability_exports.py
          flake8 backend/main.py flow_observability.py tests/test_api_observability_exports.py
          mypy backend/main.py flow_observability.py
          pytest -q tests/test_flow_observability.py tests/test_api_observability_exports.py

      - name: Commit implementation and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py flow_observability.py tests/test_api_observability_exports.py
          git rm .github/workflows/automation-patch-observability.yml
          git commit -m "feat: add authenticated observability export APIs"
          git push origin HEAD:feat/observability-export-api
