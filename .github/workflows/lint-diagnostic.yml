name: Lint diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-output:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Capture lint diagnostics
        run: |
          flake8 . > /tmp/flake8.txt 2>&1 || true
          mypy . > /tmp/mypy.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: |
            /tmp/flake8.txt
            /tmp/mypy.txt
          if-no-files-found: error
          retention-days: 1
