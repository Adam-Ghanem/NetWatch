name: Lint diagnostic

on:
  push:
    branches: [feature/flow-investigation-timeline]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Capture diagnostics
        shell: bash
        run: |
          { flake8 .; } > flake8.txt 2>&1 || true
          { mypy .; } > mypy.txt 2>&1 || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lint-type-diagnostics
          path: |
            flake8.txt
            mypy.txt
          if-no-files-found: error
