name: Capture actual NetWatch UI screenshots

on:
  pull_request:
    paths:
      - ".github/workflows/capture-ui.yml"
      - "scripts/capture_ui_screenshots.py"

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app and browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Start a local isolated NetWatch instance
        env:
          NETWATCH_API_KEY: screenshot-demo-only-key-with-32-or-more-chars
          NETWATCH_DATA_DIR: ${{ runner.temp }}/netwatch-ui
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/netwatch-ui-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "NetWatch did not start"
          tail -80 /tmp/netwatch-ui-server.log
          exit 1
      - name: Screenshot real application
        env:
          NETWATCH_API_KEY: screenshot-demo-only-key-with-32-or-more-chars
        run: python scripts/capture_ui_screenshots.py
      - name: Upload image files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netwatch-real-ui-screenshots
          path: screenshots-captured/*.png
          if-no-files-found: warn
          retention-days: 7
