name: NetWatch service evidence upgrade

on:
  push:
    branches:
      - automation/service-evidence-ux

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install --upgrade pip pytest black flake8
      - name: Apply bounded service evidence UX patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/app-core.js')
          source = path.read_text(encoding='utf-8')

          def replace_once_in_section(text, start, end, old, new, label):
              start_at = text.find(start)
              if start_at < 0:
                  raise SystemExit(f'Expected {label} section start was not found.')
              end_at = text.find(end, start_at)
              if end_at < 0:
                  raise SystemExit(f'Expected {label} section end was not found.')
              section = text[start_at:end_at]
              if section.count(old) != 1:
                  raise SystemExit(
                      f'Expected exactly one {label} anchor, found {section.count(old)}; refusing rewrite.'
                  )
              section = section.replace(old, new, 1)
              return text[:start_at] + section + text[end_at:]

          persisted_anchor = "    { key: 'service', label: 'Service' },\n"
          persisted_fields = persisted_anchor + (
              "    { key: 'service_detection', label: 'Detection' },\n"
              "    { key: 'service_product', label: 'Product' },\n"
              "    { key: 'service_version', label: 'Version' },\n"
              "    { key: 'service_confidence', label: 'Confidence', chip: true },\n"
          )
          source = replace_once_in_section(
              source,
              'async function loadInventory() {',
              'function formatBytes(value) {',
              persisted_anchor,
              persisted_fields,
              'persisted service evidence table',
          )

          immediate_anchor = "      { key: 'Service', label: 'Service' },\n"
          immediate_fields = immediate_anchor + (
              "      { key: 'Service Detection', label: 'Detection' },\n"
              "      { key: 'Service Product', label: 'Product' },\n"
              "      { key: 'Service Version', label: 'Version' },\n"
              "      { key: 'Service Confidence', label: 'Confidence', chip: true },\n"
          )
          source = replace_once_in_section(
              source,
              "$('#ports-form').addEventListener('submit'",
              "$('#traffic-interface-refresh').addEventListener('click'",
              immediate_anchor,
              immediate_fields,
              'immediate port evidence table',
          )

          timeline_old = 'This IPv4 address is valid but is not saved in inventory and has no retained activity.'
          timeline_new = 'This valid IP address is not saved in inventory and has no retained activity.'
          if source.count(timeline_old) != 1:
              raise SystemExit(
                  f'Expected exactly one dual-stack timeline wording anchor, found {source.count(timeline_old)}.'
              )
          source = source.replace(timeline_old, timeline_new, 1)
          path.write_text(source, encoding='utf-8')
          PY

          cat > tests/test_frontend_service_evidence.py <<'PY'
          from pathlib import Path


          APP_CORE = Path('frontend/app-core.js')


          def _source() -> str:
              return APP_CORE.read_text(encoding='utf-8')


          def test_inventory_service_table_surfaces_persisted_detection_evidence() -> None:
              source = _source()
              for field in (
                  "{ key: 'service_detection', label: 'Detection' }",
                  "{ key: 'service_product', label: 'Product' }",
                  "{ key: 'service_version', label: 'Version' }",
                  "{ key: 'service_confidence', label: 'Confidence', chip: true }",
              ):
                  assert field in source


          def test_port_audit_surfaces_response_backed_service_evidence() -> None:
              source = _source()
              for field in (
                  "{ key: 'Service Detection', label: 'Detection' }",
                  "{ key: 'Service Product', label: 'Product' }",
                  "{ key: 'Service Version', label: 'Version' }",
                  "{ key: 'Service Confidence', label: 'Confidence', chip: true }",
              ):
                  assert field in source


          def test_asset_timeline_empty_state_is_dual_stack_truthful() -> None:
              source = _source()
              assert 'This IPv4 address is valid' not in source
              assert 'This valid IP address is not saved in inventory' in source
          PY
      - name: Verify frontend syntax and focused regressions
        run: |
          node --check frontend/app-core.js
          black --check tests/test_frontend_service_evidence.py
          flake8 tests/test_frontend_service_evidence.py
          pytest -q tests/test_frontend_service_evidence.py
      - name: Commit verified patch
        shell: bash
        run: |
          rm .github/workflows/netwatch-service-evidence-upgrade.yml
          git config user.name 'NetWatch automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Surface persisted service detection evidence'
          git push origin HEAD:automation/service-evidence-ux
