name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Build service evidence persistence candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("inventory_store.py")
          text = path.read_text()

          table_marker = "CREATE TABLE IF NOT EXISTS service_findings ("
          before, after = text.split(table_marker, 1)
          table_body, after_table = after.split(
              "UNIQUE(scan_run_id, ip_address, protocol, port),", 1
          )
          old = "                service TEXT NOT NULL DEFAULT '',\n"
          if table_body.count(old) != 1:
              raise SystemExit("service_findings service column not found exactly once")
          table_body = table_body.replace(
              old,
              old
              + "                service_detection TEXT NOT NULL DEFAULT '',\n"
              + "                service_product TEXT NOT NULL DEFAULT '',\n"
              + "                service_version TEXT NOT NULL DEFAULT '',\n"
              + "                service_confidence TEXT NOT NULL DEFAULT '',\n",
              1,
          )
          text = (
              before
              + table_marker
              + table_body
              + "UNIQUE(scan_run_id, ip_address, protocol, port),"
              + after_table
          )

          index_marker = (
              '        conn.execute(\n'
              '            "CREATE INDEX IF NOT EXISTS idx_service_findings_scan "\n'
          )
          if text.count(index_marker) != 1:
              raise SystemExit("service findings index marker not found exactly once")
          text = text.replace(
              index_marker,
              "        _ensure_service_finding_evidence_columns(conn)\n" + index_marker,
              1,
          )

          version_marker = '        conn.execute("PRAGMA user_version = 10")\n\n\n'
          if text.count(version_marker) != 1:
              raise SystemExit("schema version marker not found exactly once")
          helper = '''def _ensure_service_finding_evidence_columns(conn: sqlite3.Connection) -> None:\n    existing = {\n        row["name"]\n        for row in conn.execute("PRAGMA table_info(service_findings)").fetchall()\n    }\n    columns = {\n        "service_detection": "TEXT NOT NULL DEFAULT ''",\n        "service_product": "TEXT NOT NULL DEFAULT ''",\n        "service_version": "TEXT NOT NULL DEFAULT ''",\n        "service_confidence": "TEXT NOT NULL DEFAULT ''",\n    }\n    for name, definition in columns.items():\n        if name not in existing:\n            conn.execute(f"ALTER TABLE service_findings ADD COLUMN {name} {definition}")\n\n\n'''
          text = text.replace(
              version_marker,
              '        conn.execute("PRAGMA user_version = 11")\n\n\n' + helper,
              1,
          )

          start = text.index("def _normalized_service_findings(")
          end = text.index("\ndef _prune_service_findings", start)
          segment = text[start:end]
          old = '        service = _audit_value(row.get("Service", ""), 120)\n'
          if segment.count(old) != 1:
              raise SystemExit("normalized service marker not found exactly once")
          segment = segment.replace(
              old,
              old
              + '        service_detection = _audit_value(row.get("Service Detection", ""), 80)\n'
              + '        service_product = _audit_value(row.get("Service Product", ""), 120)\n'
              + '        service_version = _audit_value(row.get("Service Version", ""), 80)\n'
              + '        service_confidence = _audit_value(row.get("Service Confidence", ""), 20)\n',
              1,
          )
          old_tuple = "                service,\n                status,\n"
          if segment.count(old_tuple) != 1:
              raise SystemExit("normalized finding tuple marker not found exactly once")
          segment = segment.replace(
              old_tuple,
              "                service,\n"
              "                service_detection,\n"
              "                service_product,\n"
              "                service_version,\n"
              "                service_confidence,\n"
              "                status,\n",
              1,
          )
          text = text[:start] + segment + text[end:]

          start = text.index("def update_asset_ports(")
          end = text.index("\ndef update_asset_context", start)
          segment = text[start:end]
          old_insert = '''                    scan_run_id, ip_address, port, protocol, service,\n                    status, risk, response_time_ms, observed_at\n                ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)\n'''
          if segment.count(old_insert) != 1:
              raise SystemExit("service findings insert marker not found exactly once")
          segment = segment.replace(
              old_insert,
              '''                    scan_run_id, ip_address, port, protocol, service,\n                    service_detection, service_product, service_version, service_confidence,\n                    status, risk, response_time_ms, observed_at\n                ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n''',
              1,
          )
          text = text[:start] + segment + text[end:]

          start = text.index("def recent_service_findings(")
          end = text.index("\ndef recent_scan_runs", start)
          segment = text[start:end]
          old_select = '''            SELECT scan_run_id, observed_at, ip_address, port, protocol,\n                   service, status, risk, response_time_ms\n'''
          if segment.count(old_select) != 1:
              raise SystemExit("recent service findings select marker not found exactly once")
          segment = segment.replace(
              old_select,
              '''            SELECT scan_run_id, observed_at, ip_address, port, protocol,\n                   service, service_detection, service_product, service_version,\n                   service_confidence, status, risk, response_time_ms\n''',
              1,
          )
          text = text[:start] + segment + text[end:]

          path.write_text(text)
          PY
          black inventory_store.py
          git diff --check

      - name: Upload service evidence candidate
        uses: actions/upload-artifact@v4
        with:
          name: inventory-store-patched
          path: inventory_store.py
          retention-days: 1

      - name: Check formatting and imports
        run: |
          black --check .
          isort --check-only .

      - name: Lint and type-check
        run: |
          flake8 .
          mypy .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests with coverage
        env:
          NETWATCH_API_KEY: ci-test-key-with-at-least-32-characters
          NETWATCH_DATA_DIR: /tmp/netwatch-python-ci-data
        run: pytest -q --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: unittests
          name: netwatch-python
          fail_ci_if_error: false
