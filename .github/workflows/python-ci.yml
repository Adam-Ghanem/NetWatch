name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Check formatting and imports
        run: |
          black --check .
          isort --check-only .

      - name: Lint and type-check
        run: |
          flake8 .
          mypy .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests with coverage
        env:
          NETWATCH_API_KEY: ci-test-key-with-at-least-32-characters
          NETWATCH_DATA_DIR: /tmp/netwatch-python-ci-data
        run: pytest -q --cov=. --cov-report=xml --cov-report=term-missing

      - name: Save coverage for isolated upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout for Codecov commit metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: unittests
          name: netwatch-python
          fail_ci_if_error: false
