name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Capture Black diff
        run: |
          set +e
          black --diff . > black-diff.txt 2>&1
          echo $? > black-status.txt
          cat black-diff.txt
          exit 0

      - name: Upload Black diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: black-diagnostics
          path: |
            black-diff.txt
            black-status.txt

      - name: Enforce Black
        run: test "$(cat black-status.txt)" = "0"

      - name: Check imports with isort
        run: isort --check-only .

      - name: Lint and type-check
        run: |
          flake8 .
          mypy .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests with coverage
        env:
          NETWATCH_API_KEY: ci-test-key-with-at-least-32-characters
          NETWATCH_DATA_DIR: /tmp/netwatch-python-ci-data
        run: pytest -q --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: unittests
          name: netwatch-python
          fail_ci_if_error: false
