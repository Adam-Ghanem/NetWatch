name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply deterministic asset timeline wiring
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/asset-timeline-service-version-changes'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('inventory_store.py')
          source = path.read_text(encoding='utf-8')
          old = '''    items.sort(key=lambda item: str(item.get("created_at", "")), reverse=True)\n    return items[:safe_limit]\n'''
          new = '''    # Import lazily to avoid a module-load cycle: service change intelligence reads\n    # retained findings through inventory_store but does not mutate scan state.\n    from service_change_intelligence import asset_service_version_changes\n\n    items.extend(asset_service_version_changes(normalized_ip, limit=safe_limit))\n    items.sort(key=lambda item: str(item.get("created_at", "")), reverse=True)\n    return items[:safe_limit]\n'''
          if new in source:
              raise SystemExit(0)
          if source.count(old) != 1:
              raise SystemExit('expected asset_timeline return block was not found exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet -- inventory_store.py; then
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory_store.py
          git commit -m 'feat: surface service version changes in asset timeline'
          git push origin HEAD:feature/asset-timeline-service-version-changes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Check formatting and imports
        run: |
          black --check .
          isort --check-only .

      - name: Lint and type-check
        run: |
          flake8 .
          mypy .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests with coverage
        env:
          NETWATCH_API_KEY: ci-test-key-with-at-least-32-characters
          NETWATCH_DATA_DIR: /tmp/netwatch-python-ci-data
        run: pytest -q --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: unittests
          name: netwatch-python
          fail_ci_if_error: false
