name: Temporary Formatter

on:
  push:
    branches: ["feat/traffic-flow-download-api"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/traffic-flow-download-api

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==26.3.1 "isort>=5.13,<7"

      - name: Apply project formatting
        run: |
          black .
          isort .

      - name: Commit formatter diff
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply project formatters"
          git push origin HEAD:feat/traffic-flow-download-api
