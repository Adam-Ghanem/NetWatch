name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Check formatting and imports
        run: |
          black --check .
          isort --check-only .

      - name: Lint with Flake8
        run: flake8 .

      - name: Capture mypy diagnostics
        run: |
          set +e
          mypy . > mypy-diagnostics.txt 2>&1
          echo $? > mypy-status.txt
          cat mypy-diagnostics.txt
          exit 0

      - name: Upload mypy diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: mypy-diagnostics
          path: |
            mypy-diagnostics.txt
            mypy-status.txt

      - name: Enforce mypy
        run: test "$(cat mypy-status.txt)" = "0"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests with coverage
        env:
          NETWATCH_API_KEY: ci-test-key-with-at-least-32-characters
          NETWATCH_DATA_DIR: /tmp/netwatch-python-ci-data
        run: pytest -q --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: unittests
          name: netwatch-python
          fail_ci_if_error: false
