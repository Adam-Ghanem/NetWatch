name: Patch IPv6 interface labels

on:
  push:
    branches:
      - upgrade/ipv6-interface-selector-labels

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/ipv6-interface-selector-labels
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded frontend patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/app-core.js')
          source = path.read_text(encoding='utf-8')
          old = """    option.value = item.name;\n    const details = [item.ipv4_address, item.mac_address]\n      .filter((value) => value && value !== '-')\n      .join(' · ');\n    option.textContent = `${item.name}${details ? ` · ${details}` : ''}${item.loopback ? ' · loopback' : ''}`;\n"""
          new = """    option.value = item.name;\n    const ipv6Addresses = Array.isArray(item.ipv6_addresses)\n      ? item.ipv6_addresses.filter((value) => value && value !== '-').slice(0, 2)\n      : [];\n    const ipv6Detail = ipv6Addresses.length\n      ? `IPv6 ${ipv6Addresses.join(', ')}`\n        + (item.ipv6_addresses.length > ipv6Addresses.length\n          ? ` +${item.ipv6_addresses.length - ipv6Addresses.length}`\n          : '')\n      : '';\n    const details = [item.ipv4_address, ipv6Detail, item.mac_address]\n      .filter((value) => value && value !== '-')\n      .join(' · ');\n    option.textContent = `${item.name}${details ? ` · ${details}` : ''}${item.loopback ? ' · loopback' : ''}`;\n"""
          if old not in source:
              raise SystemExit('expected loadTrafficInterfaces block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify focused regression
        run: |
          python -m pytest tests/test_ipv6_capture_interface_ui.py -q
          node --check frontend/app-core.js
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-ipv6-interface-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app-core.js .github/workflows/patch-ipv6-interface-labels.yml
          git commit -m "feat: show bounded IPv6 interface evidence"
          git push origin HEAD:upgrade/ipv6-interface-selector-labels
